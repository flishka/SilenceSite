<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход · Silence External V1.0.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/reset.css?v=3">
    <link rel="stylesheet" href="css/tokens.css?v=3">
    <link rel="stylesheet" href="css/base.css?v=3">
    <link rel="stylesheet" href="css/components.css?v=3">
    <link rel="stylesheet" href="css/auth.css?v=3">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card fade-up in-view">
            <div class="auth-header">
                <a href="index.html" style="display:inline-flex;align-items:center;gap:0.5rem;font-family:var(--font-heading);font-weight:700;font-size:1.2rem;">
                    <span style="background:var(--accent);color:#FFF;padding:4px 8px;border-radius:6px;">S</span>
                    <span>Silence V1.0.0</span>
                </a>
                <h1>Вход в систему</h1>
                <p>Авторизуйтесь для доступа к сборке и конфигурациям</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="login-username">Логин</label>
                    <input type="text" id="login-username" class="form-input" placeholder="Введите имя пользователя" required autocomplete="username">
                    <div id="error-username" class="form-error"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="login-password">Пароль</label>
                    <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                    <div id="error-password" class="form-error"></div>
                </div>

                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
                    <label class="custom-checkbox">
                        <input type="checkbox" id="login-remember" checked>
                        <span class="checkbox-box">
                            <svg class="check-svg" viewBox="0 0 14 14" fill="none">
                                <path d="M2.5 7.5L5.5 10.5L11.5 3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </span>
                        <span>Запомнить меня</span>
                    </label>
                </div>

                <div id="general-error" class="form-error" style="margin-bottom:1rem;text-align:center;"></div>

                <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width:100%;">
                    <span>Войти в аккаунт</span>
                </button>
            </form>

            <div class="auth-footer-links">
                Нет учетной записи? <a href="register.html">Зарегистрироваться</a><br>
                <a href="index.html" style="display:inline-block;margin-top:0.75rem;color:var(--muted);font-weight:normal;">&larr; На главную страницу</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth } from './js/auth.js';
        import { ui } from './js/ui.js';
        import { getSupabase } from './js/supabase.js';
        import './js/smooth-input.js';

        const form = document.getElementById('login-form');
        const submitBtn = document.getElementById('login-submit-btn');
        const generalError = document.getElementById('general-error');
        const usernameInput = document.getElementById('login-username');
        const passwordInput = document.getElementById('login-password');

        // Check if already logged in: do NOT blindly redirect, just inform
        auth.getCurrentUser().then(current => {
            if (current && (current.profile || current.user)) {
                const name = (current.profile && current.profile.username) || current.user.user_metadata?.username || 'user';
                generalError.style.color = '#7dd3fc';
                generalError.innerHTML = `Вы уже авторизованы как <strong>@${name}</strong>. <a href="#" id="inline-logout" style="text-decoration:underline;color:#fca5a5;margin-left:8px;">Сменить аккаунт</a>`;
                generalError.classList.add('visible');
                
                document.getElementById('inline-logout')?.addEventListener('click', async (e) => {
                    e.preventDefault();
                    await auth.logout();
                });
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            generalError.textContent = '';
            generalError.style.color = '#f87171';
            generalError.classList.remove('visible');

            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            const rememberMe = document.getElementById('login-remember').checked;

            if (!username || !password) {
                generalError.textContent = 'Заполните все поля.';
                generalError.classList.add('visible');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Проверка учетных данных...';

            try {
                // Clear any lingering session before new login
                const sb = getSupabase();
                if (sb) {
                    try { await sb.auth.signOut(); } catch (_) {}
                }

                const { user, profile } = await auth.login({ usernameOrEmail: username, password, rememberMe });
                
                ui.toast('Успешный вход!', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 300);
            } catch (err) {
                console.warn('Login failure:', err);
                generalError.textContent = err.message || 'Неверный логин или пароль.';
                generalError.classList.add('visible');
                passwordInput.value = '';
                passwordInput.focus();
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Войти в аккаунт';
            }
        });
    </script>
</body>
</html>
